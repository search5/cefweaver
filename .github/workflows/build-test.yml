name: build-test

# Manual only: Actions tab -> build-test -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Where to build"
        type: choice
        options: [both, linux, linux-arm, macos, macos-intel, windows, all]
        default: both
      python-version:
        description: "Python version (the examples use 3.13)"
        type: string
        default: "3.13"
      run-tests:
        description: "Run the tests after the build"
        type: boolean
        default: true
      upload-wheel:
        description: "Keep the wheel as an artifact"
        type: boolean
        default: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          case "${{ inputs.platform }}" in
            linux) m='[{"name":"linux","label":"linux","os":"ubuntu-24.04","arch":"x86_64"}]' ;;
            linux-arm) m='[{"name":"linux","label":"linux-arm","os":"ubuntu-24.04-arm","arch":"aarch64"}]' ;;
            macos) m='[{"name":"macos","label":"macos","os":"macos-14"}]' ;;
            macos-intel) m='[{"name":"macos","label":"macos-intel","os":"macos-15-intel"}]' ;;
            windows) m='[{"name":"windows","label":"windows","os":"windows-2025"}]' ;;
            all)   m='[{"name":"linux","label":"linux","os":"ubuntu-24.04","arch":"x86_64"},{"name":"linux","label":"linux-arm","os":"ubuntu-24.04-arm","arch":"aarch64"},{"name":"macos","label":"macos","os":"macos-14"},{"name":"macos","label":"macos-intel","os":"macos-15-intel"},{"name":"windows","label":"windows","os":"windows-2025"}]' ;;
            *)     m='[{"name":"linux","label":"linux","os":"ubuntu-24.04","arch":"x86_64"},{"name":"macos","label":"macos","os":"macos-14"}]' ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  build-test:
    needs: select
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: System packages (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 \
            libasound2t64 libgtk-3-0t64 fonts-noto-cjk

      - name: Build the wheel
        if: matrix.name != 'linux'
        run: uv build --wheel --python ${{ inputs.python-version }} -o dist

      # Linux: build in the manylinux_2_28 container (glibc 2.28) and tag the wheel with auditwheel.
      # The system libraries libcef.so needs are excluded on purpose, so the wheel does not carry them.
      - name: Build the wheel (Linux, manylinux_2_28)
        if: matrix.name == 'linux'
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD":/src -w /src quay.io/pypa/manylinux_2_28_${{ matrix.arch }} bash -euxc '
            yum install -y libX11-devel nss nspr atk at-spi2-atk cups-libs libdrm mesa-libgbm libxkbcommon \
              libXcomposite libXdamage libXfixes libXrandr pango alsa-lib gtk3
            PY=/opt/python/cp313-cp313/bin
            $PY/pip install uv
            $PY/uv build --wheel --python $PY/python -o /tmp/raw
            EXCLUDES=""
            for lib in libnspr4 libnss3 libnssutil3 libsmime3 libgio-2.0 libatk-1.0 libatk-bridge-2.0 libdbus-1 \
                       libcups libXcomposite libXdamage libXfixes libXrandr libgbm libexpat libxcb libxkbcommon \
                       libcairo libpango-1.0 libudev libasound libatspi; do
              EXCLUDES="$EXCLUDES --exclude $lib.so.0 --exclude $lib.so.1 --exclude $lib.so.2 --exclude $lib.so"
            done
            $PY/pip install auditwheel
            $PY/auditwheel repair --plat manylinux_2_28_${{ matrix.arch }} $EXCLUDES -w dist /tmp/raw/*.whl
            chmod -R a+rwX dist
          '

      - name: Install the wheel
        if: matrix.name != 'windows'
        run: |
          uv venv --python ${{ inputs.python-version }} .venv-test
          uv pip install --python .venv-test/bin/python dist/cefweaver-*.whl

      - name: Install the wheel (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          uv venv --python ${{ inputs.python-version }} .venv-test
          uv pip install --python .venv-test/Scripts/python.exe dist/cefweaver-*.whl pywin32

      - name: Fonts for Korean (Linux, for the diagnosis)
        if: matrix.name == 'linux'
        run: fc-list :lang=ko | head -5 || true

      - name: Tests (Linux, virtual X server)
        if: inputs.run-tests && matrix.name == 'linux'
        run: env -u WAYLAND_DISPLAY xvfb-run -a .venv-test/bin/python -P -m unittest discover -s tests -v

      - name: Tests (macOS)
        if: inputs.run-tests && matrix.name == 'macos'
        run: .venv-test/bin/python -P -m unittest discover -s tests -v

      - name: Tests (Windows)
        if: inputs.run-tests && matrix.name == 'windows'
        run: .venv-test\Scripts\python.exe -P -m unittest discover -s tests -v

      - name: Keep the wheel
        if: inputs.upload-wheel
        uses: actions/upload-artifact@v4
        with:
          name: cefweaver-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
