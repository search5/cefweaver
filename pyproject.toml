[build-system]
requires = ["setuptools>=77", "Cython>=3.0", "cmake>=3.28.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cefweaver"
version = "0.1.0"
description = "GUI toolkit for embedding a Chromium widget in desktop applications"
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jiho Lee", email = "search5@gmail.com" }]
keywords = ["cefpython"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Multimedia",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "numpy>=1.26.2",
]

# The toolkits of cefweaver.ui.toolkits (each module needs its toolkit and nothing imports them but you).
[project.optional-dependencies]
qt = ["PyQt6>=6.6"]                 # PySide6 works too (CEFQT_BINDING=pyside6): install it yourself
gtk3 = ["PyGObject>=3.42", "pycairo>=1.20"]
tk = ["Pillow>=10"]
sdl2 = ["pysdl2>=0.9.16", "pysdl2-dll"]
kivy = ["kivy>=2.3"]
pygame = ["pygame>=2.5"]            # the sound of the page for toolkits that cannot play a stream (cefweaver.ui.audio.PygameSink)
# wxPython: PyPI has only the source (a very long build); take a wheel from
# https://extras.wxpython.org/wxPython4/extras/ for your system, see examples/wx/pyproject.toml

[project.urls]
Repository = "https://github.com/search5/cefweaver"

[dependency-groups]
dev = [
    "cmake>=3.28.1",
    "Cython>=3.0",
]

[tool.setuptools.packages.find]
include = ["cefweaver*"]

[tool.setuptools.package-data]
# The CEF runtime is copied into cefweaver/ by tools/prepare.py (Linux, macOS).
# The extension module is declared in setup.py (its libraries depend on the platform).
cefweaver = [
    "*.so", "*.so.*", "*.pyd", "*.dylib",
    "cefsubprocess.app/**/*",
    "*.pak", "*.dat", "*.bin", "*.json",
    "locales/*", "cefsubprocess",
    "*.pyi", "py.typed",
]
