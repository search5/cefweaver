[build-system]
requires = ["setuptools>=77", "Cython>=3.0", "cmake>=3.28.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cefweaver"
version = "0.1.0"
description = "GUI toolkit for embedding a Chromium widget in desktop applications"
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jiho Lee", email = "search5@gmail.com" }]
keywords = ["cefpython"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Multimedia",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "numpy>=1.26.2",
]

[project.urls]
Repository = "https://github.com/search5/cefweaver"

[dependency-groups]
dev = [
    "cmake>=3.28.1",
    "Cython>=3.0",
]
docs = [
    "sphinx>=7.2.6",
]

[tool.setuptools.packages.find]
include = ["cefweaver*"]

[tool.setuptools.package-data]
# The CEF runtime is copied into cefweaver/ by tools/prepare.py (Linux).
cefweaver = [
    "*.so", "*.so.*", "*.pyd", "*.dylib",
    "*.pak", "*.dat", "*.bin", "*.json",
    "locales/*", "cefsubprocess",
    "*.pyi", "py.typed",
]

# The native libraries must be prepared first with `python tools/prepare.py`,
# which also links the CEF distribution at build/native/cef.
# Linux only for now: the library names and directories below differ on Windows.
[[tool.setuptools.ext-modules]]
name = "cefweaver._cefweaver"
sources = ["cefweaver/_cefweaver.pyx"]
language = "c++"
include-dirs = ["build/native/cef", "native/cefwrapper"]
library-dirs = [
    "build/native/native/cefwrapper",
    "build/native/libcef_dll_wrapper",
    "build/native/cef/Release",
]
# Relink when the native libraries or headers change; without this setuptools only
# compares the .pyx/.cpp timestamps and silently reuses a stale build.
depends = [
    "cefweaver/cefwrapper.pxd",
    "cefweaver/cef_api.pxd",
    "cefweaver/cef_api.pxi",
    "native/cefwrapper/generated/cefweaver_proxies.h",
    "native/cefwrapper/library.h",
    "native/cefwrapper/javascript_binding.h",
    "native/cefwrapper/query_router.h",
    "build/native/native/cefwrapper/libcefwrapper.a",
    "build/native/libcef_dll_wrapper/libcef_dll_wrapper.a",
    "build/native/cef/Release/libcef.so",
]
# Order matters for the static libraries: cefwrapper uses cef_dll_wrapper.
libraries = ["cefwrapper", "cef_dll_wrapper", "cef", "X11", "dl", "pthread"]
# Must match how the CEF wrapper libraries were compiled (see flags.make).
define-macros = [["NDEBUG", "1"], ["_FILE_OFFSET_BITS", "64"]]
extra-compile-args = ["-std=c++20"]
extra-link-args = ["-Wl,-rpath,$ORIGIN"]
