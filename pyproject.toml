[build-system]
requires = ["scikit-build-core>=0.10", "Cython>=3.0", "cmake>=3.28.1"]
build-backend = "scikit_build_core.build"

[project]
name = "cefweaver"
version = "0.1.0"
description = "GUI toolkit for embedding a Chromium widget in desktop applications"
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jiho Lee", email = "search5@gmail.com" }]
keywords = ["cefpython"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Multimedia",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "numpy>=1.26.2",
]

# The toolkits of cefweaver.ui.toolkits (each module needs its toolkit and nothing imports them but you).
[project.optional-dependencies]
qt = ["PyQt6>=6.6"]                 # PySide6 works too (CEFQT_BINDING=pyside6): install it yourself
gtk3 = ["PyGObject>=3.42", "pycairo>=1.20"]
tk = ["Pillow>=10"]
sdl2 = ["pysdl2>=0.9.16", "pysdl2-dll"]
kivy = ["kivy>=2.3"]
pywin32 = ["pywin32>=306; sys_platform == 'win32'"]   # a Win32 window (Windows only)
pygame = ["pygame>=2.5"]            # the sound of the page for toolkits that cannot play a stream (cefweaver.ui.audio.PygameSink)
# wxPython: PyPI has only the source (a very long build); take a wheel from
# https://extras.wxpython.org/wxPython4/extras/ for your system, see examples/wx/pyproject.toml

[project.urls]
Repository = "https://github.com/search5/cefweaver"

[dependency-groups]
dev = [
    "cmake>=3.28.1",
    "Cython>=3.0",
]

[tool.scikit-build]
# CMake builds everything: the CEF wrapper libraries, cefsubprocess, the extension module and the staging of the
# CEF runtime into the wheel (see cmake/CefweaverExtension.cmake). CEF comes from $CEF_ROOT or is downloaded.
minimum-version = "build-system.requires"
build-dir = "build/skbuild/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["cefweaver"]
wheel.py-api = "cp311"
wheel.exclude = ["**/*.pyx", "**/*.pxd", "**/*.pxi", "**/CMakeLists.txt", "**/__pycache__", "**/_cefweaver.cpp"]
install.strip = true

[[tool.scikit-build.overrides]]
# The CEF wrapper libraries are built for macOS 12 (CEF_TARGET_SDK in CEF's cmake); without this the wheel is
# tagged with the version of the build machine (macosx_26_0_arm64) and does not install on an older macOS.
if.platform-system = "^darwin"
cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET = "12.0"
