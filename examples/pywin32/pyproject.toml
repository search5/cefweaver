[project]
name = "cefweaver-pywin32-example"
version = "0.1.0"
description = "An offscreen cefweaver browser in a Win32 window (pywin32)"
requires-python = ">=3.13,<3.14"        # the wheel is built for CPython 3.13 (uv build --wheel)
dependencies = ["cefweaver", "pywin32>=306"]

[tool.uv]
package = false

[tool.uv.sources]
# The wheel of this repository: `uv build --wheel` in the repository root first.
cefweaver = { path = "../../dist/cefweaver-0.1.0-cp313-cp313-win_amd64.whl" }
