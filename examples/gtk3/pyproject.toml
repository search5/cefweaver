[project]
name = "cefweaver-gtk3-example"
version = "0.1.0"
description = "An offscreen cefweaver browser in a GTK 3 widget"
requires-python = ">=3.13,<3.14"        # the wheel is built for CPython 3.13 (uv build --wheel)
dependencies = [
    "cefweaver",
    "pygobject>=3.50",                   # built from source: libgirepository-dev, libcairo2-dev, gir1.2-gtk-3.0
    "pycairo>=1.26",
    "pygame>=2.5",                       # the sound of the page, as GTK has no stream to play (GStreamer is not used)
]

[tool.uv]
package = false

[tool.uv.sources]
# The wheel of this repository: `uv build --wheel` in the repository root first.
cefweaver = { path = "../../dist/cefweaver-0.1.0-cp313-cp313-linux_x86_64.whl" }
