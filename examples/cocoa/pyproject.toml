[project]
name = "cefweaver-cocoa-example"
version = "0.1.0"
description = "A cefweaver browser as a child NSView of a Cocoa window (macOS)"
requires-python = ">=3.13"
dependencies = ["cefweaver", "pyobjc-framework-Cocoa>=10"]

[tool.uv]
package = false

[tool.uv.sources]
# The wheel of this repository: `uv build --wheel` in the repository root first.
cefweaver = { path = "../../dist/cefweaver-0.1.0-cp314-cp314-macosx_13_0_arm64.whl" }
