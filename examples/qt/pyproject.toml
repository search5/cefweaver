[project]
name = "cefweaver-qt-example"
version = "0.1.0"
description = "An offscreen cefweaver browser in a Qt widget (PyQt6 or PySide6)"
requires-python = ">=3.13,<3.14"        # the wheel is built for CPython 3.13 (uv build --wheel)
dependencies = ["cefweaver"]

[project.optional-dependencies]
pyqt = ["PyQt6>=6.6"]
pyside = ["PySide6>=6.6"]

[tool.uv]
package = false

[tool.uv.sources]
# The wheel of this repository: `uv build --wheel` in the repository root first.
cefweaver = { path = "../../dist/cefweaver-0.1.0-cp313-cp313-linux_x86_64.whl" }
